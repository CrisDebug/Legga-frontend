
<div class="layout">

  <!-- ==================================================
       1. BARRA SUPERIOR PARA MÓVILES
       ================================================== -->

  <header class="barra-movil">
    <button
      class="boton-menu"
      type="button"
      (click)="alternarMenu()"
      [attr.aria-expanded]="menuAbierto"
      aria-label="Abrir o cerrar menú">
      ☰
    </button>

    <img class="logo-movil" src="/legga-logo.svg" alt="LEGGA">
  </header>

  <!-- Fondo para cerrar el menú móvil -->

  <div
    class="fondo-menu"
    [class.visible]="menuAbierto"
    (click)="cerrarMenu()">
  </div>

  <!-- ==================================================
       2. MENÚ LATERAL
       ================================================== -->

  <aside class="menu-lateral" [class.abierto]="menuAbierto">

    <!-- Logotipo -->

    <div class="marca">
      <img src="/legga-logo.svg" alt="LEGGA">
    </div>

    <!-- ==================================================
         3. NAVEGACIÓN PRINCIPAL
         ================================================== -->

    <nav class="navegacion" aria-label="Navegación principal">

      <!-- Opciones principales -->

      @for (opcion of opcionesMenu; track opcion.ruta) {
        <a
          class="enlace-menu"
          [routerLink]="opcion.ruta"
          routerLinkActive="activo"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="cerrarMenu()">

          <lucide-icon
            [img]="obtenerIcono(opcion.icono)"
            [size]="19"
            class="icono-menu">
          </lucide-icon>

          <span>{{ opcion.etiqueta }}</span>
        </a>
      }

      <!-- Configuración: acceso independiente -->

      <a
        class="enlace-menu"
        routerLink="/configuracion"
        routerLinkActive="activo"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="cerrarMenu()">

        <lucide-icon
          [img]="iconos.Settings"
          [size]="19"
          class="icono-menu">
        </lucide-icon>

        <span>Configuración</span>
      </a>

    </nav>

    <!-- ==================================================
         4. OPCIONES INFERIORES
         ================================================== -->

    <div class="menu-inferior">

      <!-- Mi perfil -->

      <a
        class="enlace-menu enlace-perfil"
        [routerLink]="opcionPerfil.ruta"
        routerLinkActive="activo"
        (click)="cerrarMenu()">

        <lucide-icon
          [img]="obtenerIcono(opcionPerfil.icono)"
          [size]="19"
          class="icono-menu">
        </lucide-icon>

        <span>{{ opcionPerfil.etiqueta }}</span>
      </a>

      <!-- Cerrar sesión -->

      <a
        class="enlace-sesion"
        routerLink="/login-elegante"
        (click)="cerrarMenu()">

        <lucide-icon
          [img]="iconos.LogOut"
          [size]="19"
          class="icono-menu icono-sesion">
        </lucide-icon>

        <span>Cerrar sesión</span>
      </a>

    </div>

  </aside>

  <!-- ==================================================
       5. CONTENIDO PRINCIPAL
       ================================================== -->

  <main class="contenido-principal">
    <router-outlet />
  </main>

</div>
