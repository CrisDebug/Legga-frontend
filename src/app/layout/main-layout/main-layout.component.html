<div class="layout">
  <header class="barra-movil">
    <button
      class="boton-menu"
      type="button"
      (click)="alternarMenu()"
      [attr.aria-expanded]="menuAbierto"
      aria-label="Abrir o cerrar menú">
      ☰
    </button>
    <img class="logo-movil" src="/legga-logo.svg" alt="LEGGA">
  </header>

  <div
    class="fondo-menu"
    [class.visible]="menuAbierto"
    (click)="cerrarMenu()">
  </div>

  <aside class="menu-lateral" [class.abierto]="menuAbierto">
    <div class="marca">
      <img src="/legga-logo.svg" alt="LEGGA">
    </div>

    <nav class="navegacion" aria-label="Navegación principal">
      @for (opcion of opcionesMenu; track opcion.ruta) {
        <a
          class="enlace-menu"
          [routerLink]="opcion.ruta"
          routerLinkActive="activo"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="cerrarMenu()">
          @if (opcion.etiqueta === 'Legajos') {
            <svg class="icono-menu" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H10l2 2h6.5A2.5 2.5 0 0 1 21 9.5v8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/>
              <path d="M3 10h18"/>
            </svg>
          } @else if (opcion.etiqueta === 'Categorías') {
            <svg class="icono-menu" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.6 13.4 13 21l-10-10V3h8z"/>
              <circle cx="7.5" cy="7.5" r="1"/>
              <path d="m14 4 6 6"/>
            </svg>
          } @else if (opcion.etiqueta === 'Trazabilidad') {
            <svg class="icono-menu" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/>
              <path d="M3 3v5h5"/>
              <path d="M12 7v5l3 2"/>
            </svg>
          }
          <span>{{ opcion.etiqueta }}</span>
        </a>
      }
    </nav>

    <div class="menu-inferior">
      <a
        class="enlace-sesion"
        routerLink="/login-elegante"
        (click)="cerrarMenu()">
        <svg class="icono-menu icono-sesion" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10 17l5-5-5-5"/>
          <path d="M15 12H3"/>
          <path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/>
        </svg>
        <span>Cerrar sesión</span>
      </a>
    </div>
  </aside>

  <main class="contenido-principal">
    <router-outlet />
  </main>
</div>
