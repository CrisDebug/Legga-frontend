
<!-- FONDO GENERAL -->
<div
  class="flex min-h-screen items-center justify-center bg-[#F2E8DE] p-0 sm:p-6 lg:p-10"
>

  <!-- CONTENEDOR ÚNICO LEGGA -->
  <main
    class="grid min-h-screen w-full max-w-6xl grid-cols-1 overflow-hidden bg-[#FFF8F0] sm:min-h-0 sm:shadow-xl lg:min-h-[600px] lg:grid-cols-2"
  >

    <!-- IDENTIDAD VISUAL -->
    <section
      class="flex min-h-[240px] items-center justify-center bg-[#C8755D] px-8 py-12 sm:min-h-[280px] lg:min-h-[600px] lg:px-12"
    >
      <img
        src="/legga-logo.svg"
        alt="Logo de LEGGA"
        class="h-auto w-full max-w-sm object-contain"
      />
    </section>

    <!-- PANEL DE ACCESO -->
    <section
      class="flex items-center justify-center bg-[#FFF8F0] px-6 py-12 sm:px-12 sm:py-16 lg:px-12 xl:px-16"
    >

      <!-- CONTENIDO DEL FORMULARIO -->
      <div class="w-full max-w-sm">

        <!-- ENCABEZADO -->
        <header class="mb-8">
          <p
            class="mb-3 text-xs font-semibold uppercase tracking-[0.18em] text-[#A9442B]"
          >
            Bienvenido a LEGGA
          </p>

          <h1 class="text-3xl font-semibold tracking-tight text-[#292522]">
            Inicia sesión
          </h1>
        </header>

        <!-- FORMULARIO -->
        <form
          class="space-y-5"
          (submit)="$event.preventDefault()"
        >

          <!-- CORREO ELECTRÓNICO -->
          <div>
            <label
              for="email"
              class="mb-2 block text-sm font-medium text-stone-700"
            >
              Correo electrónico
            </label>

            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="nombre@correo.com"
              required
              class="w-full border border-stone-300 bg-white px-4 py-3 text-sm outline-none transition placeholder:text-stone-400 focus:border-[#A9442B] focus:ring-2 focus:ring-[#A9442B]/10"
            />
          </div>

          <!-- CONTRASEÑA -->
          <div>
            <div class="mb-2 flex items-center justify-between gap-3">
              <label
                for="password"
                class="text-sm font-medium text-stone-700"
              >
                Contraseña
              </label>

              <a
                href="#recuperar"
                class="text-xs font-medium text-[#A9442B] hover:underline"
              >
                ¿La olvidaste?
              </a>
            </div>

            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Ingresa tu contraseña"
              required
              class="w-full border border-stone-300 bg-white px-4 py-3 text-sm outline-none transition placeholder:text-stone-400 focus:border-[#A9442B] focus:ring-2 focus:ring-[#A9442B]/10"
            />
          </div>

          <!-- BOTÓN DE ACCESO -->
          <button
            type="submit"
            class="w-full bg-[#963F28] px-4 py-3 text-sm font-semibold text-white transition hover:bg-[#7D3321] focus:outline-2 focus:outline-offset-2 focus:outline-[#963F28] active:scale-[0.99]"
          >
            Iniciar sesión
          </button>

        </form>

        <!-- PIE -->
        <p class="mt-8 text-center text-xs text-stone-400">
          LEGGA · Prototipo de interfaz
        </p>

      </div>
    </section>

  </main>
</div>
