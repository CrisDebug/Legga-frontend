
<!-- FONDO GENERAL -->
<div class="flex min-h-screen items-center justify-center bg-[#F2E8DE] p-0 sm:p-6 lg:p-10">

  <!-- CONTENEDOR PRINCIPAL LEGGA -->
  <main class="grid min-h-screen w-full max-w-6xl grid-cols-1 overflow-hidden bg-[#FFF8F0] sm:min-h-0 sm:shadow-xl lg:min-h-[600px] lg:grid-cols-2">

    <!-- IDENTIDAD VISUAL -->
    <section class="flex min-h-[240px] items-center justify-center bg-[#FFF8F0] px-8 py-12 sm:min-h-[280px] lg:min-h-[600px] lg:px-12">
      <img
        src="/legga-logo.svg"
        alt="Logo de LEGGA"
        class="h-auto w-full max-w-sm object-contain"
      />
    </section>

    <!-- PANEL DE ACCESO -->
    <section class="flex items-center justify-center bg-[#C8755D] px-6 py-10 sm:px-12 sm:py-12 lg:px-12 xl:px-16">

      <!-- FORMULARIO COMPACTO -->
      <div class="w-full max-w-xs">

        <!-- ENCABEZADO -->
        <header class="mb-6">
          <p class="mb-2 text-xs font-semibold uppercase tracking-[0.18em] text-[#652B1D]">
            Bienvenido a LEGGA
          </p>

          <h1 class="text-3xl font-semibold tracking-tight text-[#FFF8F0]">
            Inicia sesión
          </h1>
        </header>

        <!-- FORMULARIO -->
        <form class="space-y-4" (submit)="$event.preventDefault()">

          <!-- CORREO ELECTRÓNICO -->
          <div>
            <label for="email" class="mb-1.5 block text-sm font-medium text-white">
              Correo electrónico
            </label>

            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="nombre@correo.com"
              required
              class="w-full border border-[#E5D4C7] bg-[#FFF8F0] px-3 py-2 text-sm text-[#292522] outline-none transition placeholder:text-stone-400 focus:border-[#652B1D] focus:ring-2 focus:ring-[#652B1D]/10"
            />
          </div>

          <!-- CONTRASEÑA -->
          <div>
            <div class="mb-1.5 flex items-center justify-between gap-3">
              <label for="password" class="text-sm font-medium text-white">
                Contraseña
              </label>

              <a
                href="#recuperar"
                class="text-xs font-medium text-[#652B1D] hover:underline"
              >
                ¿La olvidaste?
              </a>
            </div>

            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Ingresa tu contraseña"
              required
              class="w-full border border-[#E5D4C7] bg-[#FFF8F0] px-3 py-2 text-sm text-[#292522] outline-none transition placeholder:text-stone-400 focus:border-[#652B1D] focus:ring-2 focus:ring-[#652B1D]/10"
            />
          </div>

          <!-- BOTÓN DE ACCESO -->
          <button
            type="submit"
            class="w-full bg-[#652B1D] px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-[#512217] focus:outline-2 focus:outline-offset-2 focus:outline-[#652B1D] active:scale-[0.99]"
          >
            Iniciar sesión
          </button>

        </form>

        <!-- PIE DE PÁGINA -->
        <p class="mt-6 text-center text-xs text-[#FFF8F0]">
          LEGGA · Prototipo de interfaz B
        </p>

      </div>
    </section>

  </main>
</div>
